# Release gate: build store, self and AppGallery, assert package shape and
# size budgets, and upload the evidence. Triggered manually or on a v* tag.
name: Gate Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: [self-hosted, macOS, ARM64, deveco]
    timeout-minutes: 120
    env:
      DEVECO_HOME: ${{ vars.DEVECO_HOME }}
      HARMONY_INPUTS_DIR: ${{ vars.HARMONY_INPUTS_DIR }}
      HARMONY_UNSIGNED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: G0/G1 gates
        run: |
          python3 gates/run.py --tier G0 --evidence-dir .build/gate-evidence
          python3 gates/run.py --tier G1 --evidence-dir .build/gate-evidence
      - name: Build and validate all release variants
        run: ./scripts/adaptation/release_dry_run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-release
          path: |
            .build/gate-evidence
            docs/evidence/release/*.json
          if-no-files-found: ignore
