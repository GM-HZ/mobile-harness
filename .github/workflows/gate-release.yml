# Release gate: build the store and self variants, assert their HAP shape and
# size budgets, and upload the evidence. Triggered manually or on a v* tag.
name: Gate Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: [self-hosted, macOS, ARM64, deveco]
    timeout-minutes: 120
    env:
      DEVECO_HOME: ${{ vars.DEVECO_HOME }}
      HARMONY_INPUTS_DIR: ${{ vars.HARMONY_INPUTS_DIR }}
      HARMONY_UNSIGNED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: G0/G1 gates
        run: |
          python3 gates/run.py --tier G0 --evidence-dir .build/gate-evidence
          python3 gates/run.py --tier G1 --evidence-dir .build/gate-evidence
      - name: Build store variant and assert shape
        run: |
          HARMONY_UNSIGNED=1 ./build.sh --package
          cp .build/artifacts/harmonyos/*-unsigned.hap .build/store.hap
          python3 scripts/adaptation/store_build_check.py --hap .build/store.hap
          python3 scripts/adaptation/variant_check.py --variant store --hap .build/store.hap
      - name: Build self variant and assert shape
        run: |
          HARMONY_UNSIGNED=1 HARMONY_SELF_BUILD=1 ./build.sh --package
          cp .build/artifacts/harmonyos/*-unsigned.hap .build/self.hap
          python3 scripts/adaptation/variant_check.py --variant self --hap .build/self.hap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-release
          path: .build/gate-evidence
          if-no-files-found: ignore
